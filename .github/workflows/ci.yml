name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release-candidate/launchclip

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
            package_smoke: true
          - os: ubuntu-latest
            node: "24"
            package_smoke: false
          - os: macos-latest
            node: "22"
            package_smoke: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - if: matrix.package_smoke
        run: npm run package:smoke
