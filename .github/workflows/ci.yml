name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release-candidate/launchclip

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22"
            package_smoke: true
          - os: ubuntu-latest
            node: "24"
            package_smoke: false
          - os: macos-latest
            node: "22"
            package_smoke: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # onnxruntime-node's install script downloads CUDA binaries the tests
      # never use; on Node 22 that download times out and fails the install.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - if: matrix.package_smoke
        run: npm run package:smoke
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

  # The whole suite with the media tests (test/helpers/media.js): real Remotion
  # and HyperFrames renders, FFmpeg chains and Playwright recordings, which the
  # default npm test above skips. FFmpeg is installed here, so the tests that
  # skip without it run too. Split across two runners. Locally: npm run
  # test:media (media files only) or npm run test:all (everything).
  media:
    name: Full suite with media ${{ matrix.shard }}/2 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci
      - name: Cache headless Chrome builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            node_modules/.remotion
            ~/.cache/ms-playwright
          key: media-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Playwright's Chromium: the state-events eval (scripts/state-events.mjs)
      # and the demo recorder launch it.
      - name: Ensure headless Chrome for both renderers and Playwright
        run: |
          npx hyperframes browser ensure
          npx remotion browser ensure
          npx playwright install --only-shell chromium
      - name: Full suite with media tests
        run: npm run test:all -- --test-shard=${{ matrix.shard }}/2

  # Cross-OS renderer parity: the bundled fonts must make HyperFrames and
  # Remotion draw the same text on Linux as on macOS. Five representative
  # fixtures (every default registry font) plus full-frame stills of
  # examples/story/minimal and examples/story/ui-parity-9x16 (interface scenes
  # on signal-ui, scripts/parity-ci.mjs). The parity-sample job below renders
  # a rotating slice of the per-module corpus, and the "Parity corpus"
  # workflow (parity-full.yml) renders all of it.
  parity:
    name: Renderer parity on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci
      - name: Cache headless Chrome builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            node_modules/.remotion
          key: parity-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure headless Chrome for both renderers
        run: |
          npx hyperframes browser ensure
          npx remotion browser ensure
      - name: Parity smoke
        run: npm run parity:ci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-ubuntu
          path: qa/parity-ci/
          if-no-files-found: ignore

  # A rotating twelfth of the per-module parity corpus at two sample times
  # (settled and mid-hold): every fixture is rendered once in any twelve
  # consecutive runs (scripts/parity-shard.mjs). About 40 fixtures at 6 to 8 s
  # each, so it finishes inside the parity job above.
  parity-sample:
    name: Renderer parity sample on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci
      - name: Cache headless Chrome builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hyperframes
            node_modules/.remotion
          key: parity-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Ensure headless Chrome for both renderers
        run: |
          npx hyperframes browser ensure
          npx remotion browser ensure
      - name: Rotating slice of the per-module fixtures
        run: node scripts/parity-shard.mjs --rotate ${{ github.run_number }} --every 12 --times settle,mid --out qa/parity-shard
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-sample
          path: |
            qa/parity-shard/summary.md
            qa/parity-shard/timings.json
            qa/parity-shard/**/report.json
            qa/parity-shard/**/*.side-by-side.png
          if-no-files-found: ignore
