# Publish LaunchClip's packages to npm, by hand, with provenance.
#
# Run it from the Actions tab (Release → Run workflow) on main and choose
# which packages to publish. It tests, packs, scans every tarball, then
# publishes in dependency order (core → remotion → engine → launchclip) with
# an npm provenance statement tying each package to this run and commit. A
# version that is already on npm is skipped, so a failed run can be re-run.
#
# Authentication: npm trusted publishing (OIDC, no stored token) once each
# package lists this workflow as its trusted publisher on npmjs.com. Until
# then (a package's first publish), it uses the NPM_TOKEN secret: a granular
# token limited to the launchclip packages with a short expiry, deleted once
# trusted publishing is set up.
name: Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish (space separated): core remotion engine launchclip"
        required: true
        default: "core remotion"

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:smoke

      - name: Pack and scan
        env:
          PACKAGES: ${{ inputs.packages }}
          RELEASE_FORBIDDEN_TERMS: ${{ vars.RELEASE_FORBIDDEN_TERMS }}
        run: |
          read -ra names <<<"$PACKAGES"
          node scripts/release-check.mjs pack "${names[@]}"

      - name: Publish
        env:
          PACKAGES: ${{ inputs.packages }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          read -ra names <<<"$PACKAGES"
          node scripts/release-check.mjs publish "${names[@]}"
