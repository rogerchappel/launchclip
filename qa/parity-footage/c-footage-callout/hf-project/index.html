<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Footage-led example: one recording, edited and dressed</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'Anton'; src: url("fonts/anton-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: 'Inter'; src: url("fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
    @font-face { font-family: 'JetBrains Mono'; src: url("fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: block; }
    @font-face { font-family: 'STIX Two Text'; src: url("fonts/stix-two-text-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; font-style: normal; font-display: block; }
    @font-face { font-family: 'STIX Two Text'; src: url("fonts/stix-two-text-latin-wght-italic.woff2") format("woff2"); font-weight: 400 700; font-style: italic; font-display: block; }
    @font-face { font-family: 'Instrument Serif'; src: url("fonts/instrument-serif-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: 'Instrument Serif'; src: url("fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
    @font-face { font-family: 'STIX Two Math'; src: url("fonts/stix-two-math-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    @font-face { font-family: 'Space Grotesk'; src: url("fonts/space-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 300 700; font-style: normal; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #06070d; }
    #launchclip-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; --lc-font-display: 'Anton', 'STIX Two Math', sans-serif; --lc-font-body: 'Space Grotesk', 'Inter', 'STIX Two Math', sans-serif; --lc-font-meta: 'JetBrains Mono', 'STIX Two Math', monospace; --cap-font: 'Anton', 'STIX Two Math', sans-serif; --cap-idle: #f2eee6; --cap-active: #fdb022; font-family: var(--lc-font-body); }
    #lc-bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #06070d; }
    .lc-scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; isolation: isolate; overflow: hidden; pointer-events: none; }
    .lc-layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% 50%; }
    .lc-plate > .lc-layer { background: #06070d; }
    .lc-placeholder { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 40px; overflow: hidden; background: #1b1d24; color: #f7f7f8; border: 4px dashed #ff5a36; border-radius: 24px; font-family: 'Inter', 'STIX Two Math', sans-serif; }
    .lc-placeholder-label { font-size: 52px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
    .lc-placeholder-detail { font-size: 28px; line-height: 1.3; color: #c4c7cf; overflow-wrap: anywhere; }
    
    #builder{pointer-events:none}#builder svg{display:block}
  </style>
  <script>if (document.fonts) for (const face of document.fonts) face.load().catch(() => {});</script>
</head>
<body>
  <div id="launchclip-root" data-composition-id="launchclip-story" data-start="0" data-duration="20" data-width="1080" data-height="1920" data-fps="30" data-launchclip-cinematic-contract="phase-2" data-launchclip-story="launchclip.story.v1">
    <div id="lc-bg" class="clip" data-start="0" data-duration="20" data-track-index="1"></div>
    <video id="lc-base-0" class="clip lc-base-media" src="assets/recording.mp4" data-start="0" data-duration="8" data-media-start="0" data-track-index="2" data-launchclip-base-segment="0" muted playsinline style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;object-position:50% 36%;transform-origin:50% 50%;z-index:1"></video>
    <video id="lc-base-1" class="clip lc-base-media" src="assets/recording.mp4" data-start="8" data-duration="12" data-media-start="10" data-track-index="2" data-launchclip-base-segment="1" muted playsinline style="position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;object-position:50% 36%;transform-origin:50% 50%;z-index:1"></video>
    <div id="lc-scene-builder" class="lc-scene" data-launchclip-scene="builder" data-launchclip-module="footage-callout" data-launchclip-start="2.9" data-launchclip-render-end="5.6" style="z-index:10"><div id="lc-layer-builder" class="lc-layer"><div id="builder" class="clip lc-catalog-c" data-start="2.9" data-duration="2.7" data-track-index="4" data-module="footage-callout" style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;box-sizing:border-box;opacity:1;transform:translate(0px, 0px);transform-origin:585.89px 453.49px"><svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" style="position:absolute;left:0px;top:0px;overflow:visible"><path id="builder-halo" d="M604.8 691.2 L608.69 564.47" stroke="#06070d" stroke-width="18" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;opacity:0.55"/><path id="builder-line" d="M604.8 691.2 L608.69 564.47" stroke="#fdb022" stroke-width="6" stroke-linecap="round" pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1"/></svg><div id="builder-ring" style="position:absolute;left:566.8px;top:653.2px;width:76px;height:76px;box-sizing:border-box;border-radius:50%;border:5px solid #fdb022;opacity:0;transform:translate(0px, 0px) scale(0.4, 0.4);transform-origin:50% 50%"></div><div id="builder-dot" style="position:absolute;left:589.8px;top:676.2px;width:30px;height:30px;box-sizing:border-box;border-radius:50%;background:#fdb022;border:5px solid #06070d;transform:translate(0px, 0px) scale(0, 0);transform-origin:50% 50%"></div><div id="builder-sticker" style="position:absolute;left:235.89px;top:335.78px;width:700px;height:235.42px;box-sizing:border-box;padding:24px 34px;border-radius:18px;background:#fdb022;border:none;box-shadow:0 14px 36px #00000073;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;opacity:0;transform:translate(0px, 0px) rotate(-2deg) scale(0.6, 0.6);transform-origin:50% 50%"><div style="margin:0px;white-space:nowrap;font-family:&#39;Jetbrains Mono&#39;,ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace;font-size:30px;line-height:1.25;letter-spacing:0.14em;font-weight:600;color:#3c2c12;margin-bottom:10px">ON CAMERA</div><div style="margin:0px;font-family:&#39;Anton&#39;,Impact,&#39;Arial Narrow Bold&#39;,&#39;Arial Black&#39;,sans-serif;font-size:66px;line-height:1.06;font-weight:400;color:#06070d;overflow-wrap:break-word">The person who built it</div></div></div></div></div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // builder (footage-callout) 2.9–5.6s
      tl.fromTo("#lc-scene-builder", { opacity: 0 }, { opacity: 1, duration: 0, immediateRender: false }, 2.8995);
      tl.fromTo("#lc-scene-builder", { opacity: 1 }, { opacity: 0, duration: 0, immediateRender: false }, 5.5995);
      {
      tl.set("#builder", {"opacity":1,"x":0,"y":0,"scaleX":1,"scaleY":1}, 2.9);
      tl.fromTo("#builder", {"opacity":1,"x":0,"y":0,"scaleX":1,"scaleY":1}, {"opacity":0,"x":0,"y":0,"scaleX":0.96,"scaleY":0.96,"duration":0.3,"ease":"power2.in","immediateRender":false}, 5.3);
      tl.set("#builder", {"opacity":0}, 5.6);
      tl.set("#builder-dot", {"scaleX":0,"scaleY":0}, 2.9);
      tl.fromTo("#builder-dot", {"scaleX":0,"scaleY":0}, {"scaleX":1,"scaleY":1,"duration":0.3,"ease":"back.out(2)","immediateRender":false}, 4.14);
      tl.set("#builder-ring", {"opacity":0,"scaleX":0.4,"scaleY":0.4}, 2.9);
      tl.fromTo("#builder-ring", {"opacity":0,"scaleX":0.4,"scaleY":0.4}, {"opacity":0.9,"scaleX":1,"scaleY":1,"duration":0.42,"ease":"power2.out","immediateRender":false}, 4.14);
      tl.set("#builder-halo", {"strokeDashoffset":1,"autoRound":false}, 2.9);
      tl.fromTo("#builder-halo", {"strokeDashoffset":1,"autoRound":false}, {"strokeDashoffset":0,"autoRound":false,"duration":0.3,"ease":"power2.out","immediateRender":false}, 4.26);
      tl.set("#builder-line", {"strokeDashoffset":1,"autoRound":false}, 2.9);
      tl.fromTo("#builder-line", {"strokeDashoffset":1,"autoRound":false}, {"strokeDashoffset":0,"autoRound":false,"duration":0.3,"ease":"power2.out","immediateRender":false}, 4.26);
      tl.set("#builder-sticker", {"opacity":0,"rotation":-2,"scaleX":0.6,"scaleY":0.6}, 2.9);
      tl.fromTo("#builder-sticker", {"opacity":0}, {"opacity":1,"duration":0.18,"ease":"power1.out","immediateRender":false}, 4.5);
      tl.fromTo("#builder-sticker", {"scaleX":0.6,"scaleY":0.6}, {"scaleX":1,"scaleY":1,"duration":0.45,"ease":"back.out(1.7)","immediateRender":false}, 4.5);
      }
      
      window.__timelines["launchclip-story"] = tl;
    </script>
  </div>
</body>
</html>
